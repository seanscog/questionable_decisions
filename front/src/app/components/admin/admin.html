<h1>With Great Power Comes Great Responsibility</h1>
<h3><i>At least, supposedly</i></h3>
@if (users()){
<table>
  <thead>
    <tr>
      <th>username</th>
      <th>Name</th>
    </tr>
  </thead>
  <tbody>
    @for(user of users()!; track user.username){
    <tr>
      <td>{{user.username}}</td>
      <td>{{user?.firstName ?? ""}} {{user?.lastName ?? ""}}</td>
    </tr>
    }
  </tbody>
</table>}@else{
<p>Couldn't fetch users</p>
}
